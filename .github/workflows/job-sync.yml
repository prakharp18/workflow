name: Hourly Job Sync & Alert Service

on:
  schedule:
    # Run at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  job-sync:
    name: Crawl & Sync High-Match Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: local.db
          key: sqlite-db-${{ github.run_id }}
          restore-keys: |
            sqlite-db-

      - name: Build TypeScript
        run: npm run build

      - name: Initialize & Migrate Database Schema
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:local.db' }}

      - name: Run Global Job Sync Engine
        run: node dist/cli.js sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:local.db' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
